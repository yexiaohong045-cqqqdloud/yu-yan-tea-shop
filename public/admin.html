<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>御燕茶藏｜管理後台</title><style>body{margin:0;font-family:Arial,'Microsoft JhengHei';background:#f4f5f2;color:#263b30}header{background:#183f2d;color:white;padding:18px 5%;display:flex;justify-content:space-between}.wrap{max-width:1200px;margin:30px auto;padding:0 20px}.box{background:white;padding:24px;border-radius:8px;margin-bottom:20px;box-shadow:0 3px 15px #0001}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat{background:#fff;padding:20px;border-left:4px solid #b58b47}.stat b{font-size:28px;display:block;margin-top:8px}input,select,button{padding:10px;border:1px solid #ddd;border-radius:4px;margin:4px}button{background:#214a35;color:white;cursor:pointer}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}.hide{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.box{overflow:auto}}</style></head><body><header><b>御燕茶藏 · 管理後台</b><span id="who"></span></header><div class="wrap"><div class="box" id="login"><h2>管理員登入</h2><input id="email" placeholder="管理員 Email"><input id="password" type="password" placeholder="密碼"><button onclick="login()">登入</button><p id="msg"></p></div><div id="app" class="hide"><div class="grid"><div class="stat">訂單數<b id="orders">-</b></div><div class="stat">營業額<b id="revenue">-</b></div><div class="stat">商品數<b id="products">-</b></div><div class="stat">總庫存<b id="stock">-</b></div></div><div class="box"><h2>新增商品</h2><input id="pn" placeholder="商品名稱"><input id="pc" placeholder="分類"><input id="pp" type="number" placeholder="價格"><input id="ps" type="number" placeholder="庫存"><button onclick="addProduct()">新增</button></div><div class="box"><h2>商品管理</h2><table><thead><tr><th>商品</th><th>分類</th><th>價格</th><th>庫存</th><th>狀態</th></tr></thead><tbody id="pt"></tbody></table></div><div class="box"><h2>訂單管理</h2><table><thead><tr><th>訂單</th><th>客戶</th><th>金額</th><th>付款</th><th>配送</th><th>時間</th></tr></thead><tbody id="ot"></tbody></table></div><div class="box"><h2>優惠碼</h2><input id="cc" placeholder="優惠碼"><input id="cd" type="number" placeholder="折扣 %"><button onclick="coupon()">建立優惠碼</button><div id="coupons"></div></div></div></div><script>async function api(u,o={}){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});let j=await r.json();if(!r.ok)throw Error(j.error||'error');return j}async function login(){try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});login.classList?.add('hide');document.getElementById('login').classList.add('hide');app.classList.remove('hide');load()}catch(e){msg.textContent=e.message}}async function load(){try{let d=await api('/api/admin/dashboard');orders.textContent=d.orders;revenue.textContent='NT$ '+Number(d.revenue).toLocaleString();products.textContent=d.products;stock.textContent=d.stock;let p=await api('/api/admin/products');pt.innerHTML=p.map(x=>`<tr><td>${x.name}</td><td>${x.category}</td><td>NT$ ${x.price.toLocaleString()}</td><td>${x.stock}</td><td>${x.active?'上架':'下架'}</td></tr>`).join('');let o=await api('/api/admin/orders');ot.innerHTML=o.map(x=>`<tr><td>${x.order_no}</td><td>${x.customer_name}<br>${x.phone}</td><td>NT$ ${x.total.toLocaleString()}</td><td><select onchange="upd(${x.id},this.value,null)"><option>${x.payment_status}</option><option value="paid">paid</option><option value="pending">pending</option></select></td><td><select onchange="upd(${x.id},null,this.value)"><option>${x.shipping_status}</option><option value="preparing">preparing</option><option value="shipped">shipped</option><option value="delivered">delivered</option></select></td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join('');let c=await api('/api/admin/coupons');coupons.innerHTML=c.map(x=>`<span>${x.code}：${x.discount_percent}%　</span>`).join('')}catch(e){if(e.message==='unauthorized')return}}async function addProduct(){await api('/api/admin/products',{method:'POST',body:JSON.stringify({name:pn.value,category:pc.value,price:pp.value,stock:ps.value})});load()}async function upd(id,p,s){await api('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({payment_status:p,shipping_status:s})});load()}async function coupon(){await api('/api/admin/coupons',{method:'POST',body:JSON.stringify({code:cc.value,discount_percent:cd.value})});load()}load().then(()=>{fetch('/api/admin/dashboard').then(r=>{if(r.ok){document.getElementById('login').classList.add('hide');app.classList.remove('hide');load()}})})</script></body></html>
